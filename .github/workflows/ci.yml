import { PrismaClient } from "@prisma/client";

const prisma = new PrismaClient();

async function main() {
  await prisma.user.upsert({
    where: { email: "demo@dealytask.com" },
    update: {},
    create: {
      email: "demo@dealytask.com",
      name: "Demo User",
    },
  });

  await prisma.deal.createMany({
    data: [
      {
        name: "Expansion plan",
        company: "Northstar Labs",
        value: 42000,
        stage: "CONTACTED",
      },
      {
        name: "Website redesign",
        company: "NovaFlow",
        value: 26000,
        stage: "PROPOSAL",
      },
      {
        name: "CRM migration",
        company: "Arc Studio",
        value: 54000,
        stage: "NEGOTIATION",
      },
    ],
  });
}

main()
  .then(async () => {
    await prisma.$disconnect();
  })
  .catch(async (error) => {
    console.error(error);
    await prisma.$disconnect();
    process.exit(1);
  });
